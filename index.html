<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ❤️</title>
<style>
body {
  margin:0;
  font-family:"Poppins", sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  overflow:hidden;
}
.card {
  background: rgba(255,255,255,0.18);
  padding:40px;
  border-radius:25px;
  box-shadow:0 10px 40px rgba(0,0,0,0.2);
  backdrop-filter: blur(10px);
  max-width:500px;
  z-index:2;
}
h1 { font-size:2.5rem; margin-bottom:20px;}
p { font-size:1.2rem; line-height:1.6;}
button {
  margin-top:20px;
  padding:14px 28px;
  border:none;
  border-radius:30px;
  background:white;
  color:#ff4f81;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
  position:relative;
}
button:hover{transform:scale(1.08); background:#ffe4ec;}
.popup {
  display:none;
  position:fixed;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:#ff4f81;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,0.25);
  max-width:450px;
  z-index:10;
  text-align:center;
}
.quiz-question { font-size:1.5rem; margin-bottom:20px; }
.quiz-options { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
.quiz-option {
  padding:10px;
  border-radius:15px;
  border:1px solid #ff4f81;
  cursor:pointer;
  position:relative;
  background:#fff;
  color:#ff4f81;
  font-weight:bold;
  transition: transform 4s ease;
}
.final-message {
  display:none;
  font-size:1.4rem;
  font-weight:bold;
  margin-top:20px;
  color:white;
  background: rgba(255,0,100,0.5);
  padding:20px;
  border-radius:25px;
}
.photo-popup {
  display:none;
  position:fixed;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:#ff4f81;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,0.25);
  max-width:450px;
  z-index:10;
  text-align:center;
}
.photo-popup img {
  max-width:90%;
  border-radius:15px;
  margin:10px 0;
}
.photo-note { font-size:1rem; margin-bottom:10px;}
</style>
</head>
<body>

<div class="card" id="mainCard">
<h1>Happy Birthday, My Princess ❤️</h1>
<p>Click below!</p>
<button id="startBtn">Click 💌</button>
</div>

<div class="popup" id="popup"><p id="message"></p><button id="nextBtn">Next 😘</button></div>

<div class="popup" id="quizPopup">
<p class="quiz-question" id="quizQuestion"></p>
<div class="quiz-options" id="quizOptions"></div>
<img id="quizImage" style="max-width:90%;border-radius:15px;" src="https://placekitten.com/301/200">
</div>

<div class="popup" id="morePopup"><p id="moreMessage"></p><button id="moreNextBtn">Next 😍</button></div>

<div class="photo-popup" id="photoPopup">
<p class="photo-note" id="photoNote"></p>
<img id="photoImage" src="" alt="Photo">
<button id="nextPhotoBtn">Next Photo</button>
</div>

<div class="final-message" id="finalMessage">
🎉 Happy Birthday to the only person I will let bite me! 🎉<br>
I admire you as much as you admire the moon. ❤️
</div>

<script>
// Pre-quiz messages
const messages=["I'd keep my joke about having a thing for older women for later🌚.","I was going to get you the world, but then I realized there will be other men in it and I don't like the sound of that.","You are so breathtaking, you take your own breath away."];
let index=0;
let quizIndex=0;
let moreIndex=0;
let photoIndex=0;

const popup=document.getElementById("popup");
const messageEl=document.getElementById("message");
const startBtn=document.getElementById("startBtn");
const nextBtn=document.getElementById("nextBtn");
const quizPopup=document.getElementById("quizPopup");
const quizQuestionEl=document.getElementById("quizQuestion");
const quizOptionsEl=document.getElementById("quizOptions");
const quizImage=document.getElementById("quizImage");
const morePopup=document.getElementById("morePopup");
const moreMessageEl=document.getElementById("moreMessage");
const moreNextBtn=document.getElementById("moreNextBtn");
const photoPopup=document.getElementById("photoPopup");
const photoImage=document.getElementById("photoImage");
const photoNote=document.getElementById("photoNote");
const nextPhotoBtn=document.getElementById("nextPhotoBtn");

// Restart handler
startBtn.addEventListener("click", ()=>{
  // Reset all indices
  index = 0;
  quizIndex = 0;
  moreIndex = 0;
  photoIndex = 0;

  // Hide all popups and final message
  popup.style.display = "block";
  quizPopup.style.display = "none";
  morePopup.style.display = "none";
  photoPopup.style.display = "none";
  document.getElementById("finalMessage").style.display = "none";

  // Remove dynamically added "ALL OF THE ABOVE" if it exists
  const allBtn = document.getElementById("allOption");
  if(allBtn) allBtn.remove();

  // Reset quiz options
  const allQuizButtons = document.querySelectorAll(".quiz-option");
  allQuizButtons.forEach(b => {
    b.style.pointerEvents = "auto";
    b.style.transform = "translateX(0)";
  });

  // Start the first message
  messageEl.innerText = messages[index];
});

// Pre-quiz message next button
nextBtn.addEventListener("click", ()=>{
  index++;
  if(index<messages.length){messageEl.innerText = messages[index];}
  else{popup.style.display="none"; startQuiz();}
});

// Quiz data
const quizQuestions=[
  {question:"What's a scary message from Noorah?", options:["We need to talk","I have been kidnapped","How are you doing?","Call the police"], answer:2, image:"https://placekitten.com/301/200"},
  {question:"What's my favorite activity?", options:["Cooking","Watching movies","Walking","Dakar Rally"], answer:3, image:"https://placekitten.com/302/200"},
  {question:"What skill should Noorah learn this year?", options:["Driving","More bland eggs and kale","For the plot","Answer to question 2"], answer:0, image:"https://placekitten.com/300/200"}
];

// Quiz functions
function startQuiz(){ quizPopup.style.display="block"; showQuizQuestion(); }

function showQuizQuestion(){
  const q=quizQuestions[quizIndex];
  quizQuestionEl.innerText=q.question;
  quizImage.src = q.image;
  quizOptionsEl.innerHTML = "";

  q.options.forEach((opt,i)=>{
    const btn=document.createElement("button");
    btn.className="quiz-option"; 
    btn.innerText = opt;

    if(quizIndex===2){ // Question 3 special
      btn.addEventListener("click", ()=>{
        Array.from(quizOptionsEl.children).forEach(b=>b.style.pointerEvents="none");
        if(!document.getElementById("allOption")){
          const allBtn=document.createElement("button");
          allBtn.id="allOption";
          allBtn.className="quiz-option";
          allBtn.innerText="ALL OF THE ABOVE";
          allBtn.addEventListener("click", ()=>{
            quizIndex++;
            if(quizIndex<quizQuestions.length){ showQuizQuestion(); }
            else{ quizPopup.style.display="none"; startMoreMessages(); }
          });
          quizOptionsEl.appendChild(allBtn);
        }
      });
    } else {
      if(i!==q.answer){
        btn.addEventListener("mouseenter", ()=>{ btn.style.transition="transform 4s ease"; btn.style.transform="translateX(150vw)"; btn.style.pointerEvents="none"; });
      } else {
        btn.addEventListener("click", ()=>{
          quizIndex++;
          if(quizIndex<quizQuestions.length){ showQuizQuestion(); }
          else{ quizPopup.style.display="none"; startMoreMessages(); }
        });
      }
    }
    quizOptionsEl.appendChild(btn);
  });
}

// Post-quiz messages
const moreMessages=["I adore how much you care for my banal complains.","Final surprise is coming! 🎁"];
function startMoreMessages(){ morePopup.style.display="block"; moreMessageEl.innerText = moreMessages[moreIndex]; }
moreNextBtn.addEventListener("click", ()=>{
  moreIndex++;
  if(moreIndex<moreMessages.length){ moreMessageEl.innerText = moreMessages[moreIndex]; }
  else{ morePopup.style.display="none"; startPhotoPopup(); }
});

// Photo slideshow
const photos=[
  {src:"photo1.jpeg", note:"She takes everyone's breath away, herself included 🌚"},
  {src:"photo2.jpeg", note:"This picture does something to me 😏"},
  {src:"photo3.jpg", note:"Guess who is on my acknowledgements 🥰"}
];
function startPhotoPopup(){ photoPopup.style.display="block"; photoIndex=0; showPhoto(); }
function showPhoto(){ const p=photos[photoIndex]; photoImage.src=p.src; photoNote.innerText=p.note; }
nextPhotoBtn.addEventListener("click", ()=>{
  photoIndex++;
  if(photoIndex<photos.length){ showPhoto(); }
  else{ photoPopup.style.display="none"; document.getElementById("finalMessage").style.display="block"; }
});
</script>
</body>
</html>
